<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSN 5th Semester • Curriculum-Weighted 100-MCQ Nursing Ethics Exam</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --accent-light: rgba(22, 163, 74, 0.15);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 12px; min-height: 100vh; }
    .quiz-container { max-width: 900px; margin: 0 auto; }

    /* Header & Navigation */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: 5px solid var(--accent);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #4ade80; text-decoration: none; font-size: 0.85rem; font-weight: 700;
      margin-bottom: 12px; transition: transform 0.2s;
    }
    .back-btn:hover { transform: translateX(-3px); }
    .title-area h1 { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .subtitle { color: var(--text-sub); font-size: 0.9rem; }

    /* Dashboard Bar */
    .exam-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      background: #090d16; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 20px; margin-top: 16px; gap: 12px;
    }
    .timer-badge {
      display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.1rem;
      color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    .progress-text { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }

    /* Unit Filters */
    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px;
    }
    .filter-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub);
      padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    /* MCQ Question Card */
    .q-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; margin-bottom: 20px; transition: border-color 0.2s;
    }
    .q-meta { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
    .q-badge {
      background: var(--accent-light); color: #4ade80; font-size: 0.75rem; font-weight: 700;
      padding: 3px 10px; border-radius: 12px; border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .q-num { font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }
    .q-text { font-size: 1.05rem; font-weight: 600; line-height: 1.5; margin-bottom: 18px; color: #fff; }

    /* Options Grid */
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; text-align: left; color: #cbd5e1; font-size: 0.92rem;
      cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s;
    }
    .opt-btn:hover { border-color: var(--accent); background: #1a2436; color: #fff; }
    .opt-prefix {
      width: 26px; height: 26px; border-radius: 50%; background: #1e293b; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0;
    }
    .opt-btn.selected { border-color: var(--accent); background: var(--accent-light); color: #fff; }
    .opt-btn.selected .opt-prefix { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Rationale Box */
    .rationale {
      margin-top: 16px; padding: 12px 16px; background: rgba(15, 23, 42, 0.8);
      border-left: 4px solid var(--accent); border-radius: 6px; font-size: 0.85rem; color: #cbd5e1; display: none;
    }

    /* Controls */
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
    .btn-action {
      background: var(--accent); color: #fff; border: none; padding: 12px 28px;
      border-radius: 10px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-action:hover { background: var(--accent-hover); }

    /* Results */
    .results-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px; text-align: center; display: none;
    }
    .score-circle {
      width: 140px; height: 140px; border-radius: 50%; border: 6px solid var(--accent);
      margin: 20px auto; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-weight: 800; font-size: 2rem; color: #fff;
      background: var(--accent-light);
    }

    @media (max-width: 600px) {
      .header-card { padding: 16px; }
      .q-card { padding: 16px; }
      .exam-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  
  <div class="header-card">
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
    <div class="title-area">
      <h1>BSN 5th Semester • Nursing Ethics Final Exam</h1>
      <p class="subtitle">100 MCQs weighted according to official unit credit hours (60 Minutes Exam).</p>
    </div>

    <div class="exam-bar">
      <div class="timer-badge">⏱️ <span id="timer-display">60:00</span></div>
      <div class="progress-text" id="progress-text">Question 1 of 100</div>
    </div>
  </div>

  <div class="filter-scroll">
    <button class="filter-btn active" onclick="filterUnit('All')">All 100 MCQs</button>
    <button class="filter-btn" onclick="filterUnit('Unit I')">Unit I (7)</button>
    <button class="filter-btn" onclick="filterUnit('Unit II')">Unit II (10)</button>
    <button class="filter-btn" onclick="filterUnit('Unit III')">Unit III (17)</button>
    <button class="filter-btn" onclick="filterUnit('Unit IV')">Unit IV (17)</button>
    <button class="filter-btn" onclick="filterUnit('Unit V')">Unit V (10)</button>
    <button class="filter-btn" onclick="filterUnit('Unit VI')">Unit VI (10)</button>
    <button class="filter-btn" onclick="filterUnit('Unit VII')">Unit VII (10)</button>
    <button class="filter-btn" onclick="filterUnit('Unit VIII')">Unit VIII (19)</button>
  </div>

  <div id="quiz-area">
    <div class="q-card" id="question-card">
      <div class="q-meta">
        <span class="q-badge" id="q-unit">Unit I</span>
        <span class="q-num" id="q-count">1/100</span>
      </div>
      <div class="q-text" id="q-text">Loading question...</div>
      <div class="options-grid" id="options-container"></div>
      <div class="rationale" id="rationale-box"></div>
    </div>

    <div class="controls">
      <button class="btn-action" style="background:#334155;" id="prev-btn" onclick="prevQuestion()">Previous</button>
      <button class="btn-action" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>

  <div class="results-card" id="results-screen">
    <h2 style="font-size:1.8rem;">Exam Submitted! 🎉</h2>
    <p style="color:var(--text-sub); margin-top:6px;">Performance summary for BSN 5th Semester Nursing Ethics:</p>
    
    <div class="score-circle" id="score-circle">
      <span id="score-percent">0%</span>
      <span style="font-size:0.75rem; color:var(--text-sub); font-weight:normal;">Final Score</span>
    </div>

    <p id="score-details" style="font-size:1.1rem; font-weight:700; margin-bottom:20px;"></p>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-action" onclick="restartQuiz()">🔄 Retake Exam</button>
      <button class="btn-action" style="background:#334155;" onclick="reviewAnswers()">📖 Review Answers</button>
    </div>
  </div>

</div>

<script>
const rawQuestions = [
  // --- UNIT I: INTRODUCTION TO NURSING ETHICS (1.0 hr = 7 MCQs) ---
  { unit: "Unit I", q: "The formal, theoretical study of moral beliefs and conduct that governs human actions is defined as:", opts: ["Ethics", "Morals", "Beliefs", "Etiquette"], ans: 0, rat: "Ethics is the systematic study of moral behavior and decision-making." },
  { unit: "Unit I", q: "Personal standards of right and wrong absorbed from family, culture, and religion are termed:", opts: ["Morals", "Ethics", "Statutes", "Protocol"], ans: 0, rat: "Morals refer to internal, personal standards of right and wrong." },
  { unit: "Unit I", q: "A complex situation where two compelling moral principles conflict, requiring a choice between opposing duties, is a/an:", opts: ["Ethical Dilemma", "Ethical Conflict", "Moral Distress", "Negligence"], ans: 0, rat: "An ethical dilemma presents a conflict between competing moral duties where choosing one infringes on another." },
  { unit: "Unit I", q: "According to Flexner’s criteria for a profession, which characteristic is essential for nursing?", opts: ["Self-regulation and a specialized body of knowledge", "Informal apprenticeship", "Working fixed 8-hour shifts", "Unregulated clinical practice"], ans: 0, rat: "Professions maintain specialized education, self-regulation, and statutory licensing standards." },
  { unit: "Unit I", q: "A nurse takes direct responsibility for an incorrect medication dose calculated during a shift. This behavior demonstrates:", opts: ["Accountability", "Paternalism", "Altruism", "Veracity"], ans: 0, rat: "Accountability means taking responsibility for one's actions and outcomes." },
  { unit: "Unit I", q: "Why is the study of ethics vital in modern nursing practice?", opts: ["It provides a framework to resolve clinical conflicts and protect patient rights", "It replaces hospital administrative rules", "It protects doctors from legal disputes", "It eliminates the need for informed consent"], ans: 0, rat: "Ethics prepares nurses to navigate complex clinical dilemmas safely and protect patients." },
  { unit: "Unit I", q: "Which characteristic defines a professional nurse's commitment to patient-centered care?", opts: ["Ethical sensitivity and advocacy", "Strict paternalism", "Subjective decision-making", "Financial motivation"], ans: 0, rat: "Ethical sensitivity enables nurses to recognize and advocate for client needs without personal bias." },

  // --- UNIT II: VALUE SET (1.5 hrs = 10 MCQs) ---
  { unit: "Unit II", q: "The process by which people examine, clarify, and understand their own personal values is called:", opts: ["Value Clarification", "Moralizing", "Laissez-faire", "Modeling"], ans: 0, rat: "Value clarification increases self-awareness regarding beliefs and choices." },
  { unit: "Unit II", q: "A child learns health-promoting behaviors by watching their parents continuously maintain healthy habits. Which mode of value transmission is this?", opts: ["Modeling", "Moralizing", "Laissez-faire", "Reward and Punishment"], ans: 0, rat: "Modeling teaches values through observation and example." },
  { unit: "Unit II", q: "A guardian insists, 'You must follow this rule without questioning because I said so.' This reflects:", opts: ["Moralizing", "Responsible Choice", "Laissez-faire", "Modeling"], ans: 0, rat: "Moralizing forces fixed values without permitting questions or reasoning." },
  { unit: "Unit II", q: "Which essential AACN professional value refers to unselfish concern for the health and welfare of clients?", opts: ["Altruism", "Autonomy", "Integrity", "Justice"], ans: 0, rat: "Altruism prioritizes patient welfare above self-interest." },
  { unit: "Unit II", q: "A nurse ensures privacy curtains are fully closed before starting a bed bath. This directly honors:", opts: ["Human Dignity", "Social Equality", "Utility", "Fidelity"], ans: 0, rat: "Respecting modesty and bodily privacy protects human dignity." },
  { unit: "Unit II", q: "Consistently providing honest, ethical care according to accepted professional standards even when unsupervised demonstrates:", opts: ["Integrity", "Altruism", "Paternalism", "Laissez-faire"], ans: 0, rat: "Integrity is moral uprightness and adherence to professional codes." },
  { unit: "Unit II", q: "What is the primary advantage of value clarification for a practicing nurse?", opts: ["It prevents personal values from causing bias in patient care", "It changes patient values to match the nurse's", "It reduces charting errors", "It eliminates ethical conflicts"], ans: 0, rat: "Value clarification helps nurses manage personal biases in clinical practice." },
  { unit: "Unit II", q: "When a nurse experiences personal moral distress due to conflicting values with an assigned care procedure, the nurse should:", opts: ["Request reassignment through proper channels without abandoning the patient", "Abandon the ward immediately", "Force the patient to change their mind", "Ignore the conflict and perform poor care"], ans: 0, rat: "Nurses must arrange safe coverage without abandoning client care." },
  { unit: "Unit II", q: "Allowing a young adult to make choices after explaining all alternatives and consequences is known as:", opts: ["Responsible Choice", "Moralizing", "Laissez-faire", "Reward and Punishment"], ans: 0, rat: "Responsible choice empowers autonomous decision-making." },
  { unit: "Unit II", q: "How should a nurse manage ethical care in a culturally diverse society?", opts: ["Provide non-judgmental care respecting client cultural values and beliefs", "Force clients to follow hospital culture only", "Refuse to care for diverse clients", "Ignore patient background"], ans: 0, rat: "Culturally sensitive care respects diverse patient backgrounds and values." },

  // --- UNIT III: ETHICAL PRINCIPLES AND THEORIES (2.5 hrs = 17 MCQs) ---
  { unit: "Unit III", q: "Which ethical theory (Kantianism/Deontology) asserts that actions are inherently right or wrong based on duty, regardless of outcomes?", opts: ["Deontology", "Utilitarianism", "Virtue Ethics", "Egoism"], ans: 0, rat: "Deontology evaluates duty and universal rules rather than consequences." },
  { unit: "Unit III", q: "Utilitarianism evaluates the morality of an action based on:", opts: ["Producing the greatest good for the greatest number", "Strict religious obligations", "Individual actor character", "Institutional rules"], ans: 0, rat: "Utilitarianism focuses on maximizing positive outcomes for the majority." },
  { unit: "Unit III", q: "A nurse provides clear treatment details to a competent adult patient so they can decide freely. This respects:", opts: ["Autonomy", "Beneficence", "Paternalism", "Fidelity"], ans: 0, rat: "Autonomy supports individual self-determination." },
  { unit: "Unit III", q: "The ethical duty to perform active interventions that promote client health and well-being is:", opts: ["Beneficence", "Non-maleficence", "Veracity", "Justice"], ans: 0, rat: "Beneficence requires taking positive action to help others." },
  { unit: "Unit III", q: "The obligation to 'do no harm' and prevent accidental injury during care is:", opts: ["Non-maleficence", "Beneficence", "Veracity", "Fidelity"], ans: 0, rat: "Non-maleficence focuses on preventing harm or risk of harm." },
  { unit: "Unit III", q: "Triage during a mass casualty incident prioritizes patients with the best chance of survival. This applies:", opts: ["Utilitarianism", "Deontology", "Virtue Ethics", "Egoism"], ans: 0, rat: "Mass casualty triage maximizes saved lives (Utilitarian framework)." },
  { unit: "Unit III", q: "A physician decides to withhold a diagnosis from a patient 'to keep them from worrying.' This represents:", opts: ["Paternalism", "Autonomy", "Veracity", "Justice"], ans: 0, rat: "Paternalism overrides client autonomy under the assumption of knowing best." },
  { unit: "Unit III", q: "Fair allocation of limited ICU beds based on clinical severity rather than financial status reflects:", opts: ["Justice", "Fidelity", "Veracity", "Autonomy"], ans: 0, rat: "Justice mandates equitable resource distribution based on need." },
  { unit: "Unit III", q: "A nurse promises to return in 10 minutes to reassess pain and arrives on time. This honors:", opts: ["Fidelity", "Veracity", "Autonomy", "Non-maleficence"], ans: 0, rat: "Fidelity means keeping promises and maintaining trust." },
  { unit: "Unit III", q: "Telling a patient the truth regarding the discomfort of a procedure fulfills:", opts: ["Veracity", "Fidelity", "Justice", "Beneficence"], ans: 0, rat: "Veracity demands honesty and truth-telling." },
  { unit: "Unit III", q: "An elderly client refuses a surgical procedure. The nurse supports the choice despite family pressure. The nurse upholds:", opts: ["Autonomy", "Paternalism", "Beneficence", "Fidelity"], ans: 0, rat: "Supporting a competent adult's treatment refusal honors autonomy." },
  { unit: "Unit III", q: "Checking blood pressure prior to administering a potent antihypertensive drug prevents harm. This demonstrates:", opts: ["Non-maleficence", "Justice", "Veracity", "Paternalism"], ans: 0, rat: "Safety checks avoid adverse outcomes, fulfilling non-maleficence." },
  { unit: "Unit III", q: "Virtue ethics focuses primarily on:", opts: ["Developing moral character traits like compassion and honesty", "Counting positive outcomes", "Legal statutes", "Written employment contracts"], ans: 0, rat: "Virtue ethics stresses the moral character of the practitioner." },
  { unit: "Unit III", q: "What is the first step in the ethical decision-making model?", opts: ["Assessment / Gathering all relevant clinical and personal facts", "Executing an action plan", "Filing a lawsuit", "Ignoring the problem"], ans: 0, rat: "Ethical decision-making begins with gathering comprehensive facts." },
  { unit: "Unit III", q: "A nurse struggles when a patient's autonomous decision conflicts with medical advice. The nurse should resolve this by:", opts: ["Using ethical decision-making steps to explore options with the healthcare team", "Forcing the medical plan on the patient", "Ignoring the patient completely", "Calling security"], ans: 0, rat: "Structured decision-making helps navigate complex value conflicts." },
  { unit: "Unit III", q: "Providing equal, non-judgmental nursing care to an uncooperative patient upholds:", opts: ["Justice", "Autonomy", "Paternalism", "Veracity"], ans: 0, rat: "Justice requires fair, unbiased care for all clients." },
  { unit: "Unit III", q: "A strategy to resolve ethical dilemmas in daily practice includes:", opts: ["Utilizing hospital ethics committees for interprofessional case consultation", "Deciding alone without consultation", "Following the loudest opinion", "Delaying care indefinitely"], ans: 0, rat: "Ethics committees provide balanced interdisciplinary consultation." },

  // --- UNIT IV: CONFIDENTIALITY AND INFORMED CONSENT (2.5 hrs = 17 MCQs) ---
  { unit: "Unit IV", q: "Informed consent is defined as:", opts: ["Voluntary agreement by a competent client to undergo a procedure after understanding risks and benefits", "A routine form signed at admission without explanation", "A verbal order given by a physician", "A waiver releasing the hospital from negligence"], ans: 0, rat: "Informed consent requires voluntary authorization based on full disclosure." },
  { unit: "Unit IV", q: "Who holds the primary legal obligation to explain surgical risks and obtain informed consent?", opts: ["The physician performing the procedure", "The staff bedside nurse", "The ward unit clerk", "The hospital administrator"], ans: 0, rat: "The practitioner performing the procedure must disclose details and obtain consent." },
  { unit: "Unit IV", q: "What is the nurse's legal responsibility when witnessing a consent form signature?", opts: ["Confirming the signature is authentic, voluntary, and the client is competent", "Explaining surgical steps in detail", "Guaranteeing zero surgical complications", "Signing for the family"], ans: 0, rat: "The nurse witnesses the signature, voluntariness, and capacity." },
  { unit: "Unit IV", q: "An unconscious patient requires emergency trauma surgery. Surgery proceeds without explicit consent under:", opts: ["Implied Consent", "Expressed Consent", "Proxy Consent", "Coerced Consent"], ans: 0, rat: "Emergency care assumes implied consent when the patient is unable to consent." },
  { unit: "Unit IV", q: "The four key legal elements of informed consent are Disclosure, Voluntariness, Capacity, and:", opts: ["Comprehension", "Payment", "Hospital Approval", "Witness signature from police"], ans: 0, rat: "The patient must comprehend the disclosed information." },
  { unit: "Unit IV", q: "Is a nurse allowed to post patient wound photographs on personal social media if names are removed?", opts: ["No, it breaches patient privacy and confidentiality standards", "Yes, provided the name is omitted", "Yes, if used for study groups", "Yes, after discharge"], ans: 0, rat: "Social media posts of patient data violate privacy regardless of naming." },
  { unit: "Unit IV", q: "A nurse is legally permitted to break patient confidentiality without consent when:", opts: ["Suspecting child abuse or direct threat of harm to self or others", "A family neighbor asks nicely", "A local journalist inquires", "A financial auditor calls"], ans: 0, rat: "Mandatory reporting applies to abuse or imminent physical danger." },
  { unit: "Unit IV", q: "A competent client refuses life-saving surgery after complete explanation. The healthcare team must:", opts: ["Respect the refusal, notify the physician, and document discussions", "Operate anyway under restraint", "Sedate the patient secretly", "Cancel health insurance"], ans: 0, rat: "Competent adults retain the right to refuse care." },
  { unit: "Unit IV", q: "A visitor asks about a patient's condition. The nurse sees no authorization listed. The correct response is:", opts: ["Politely state information cannot be shared without client authorization", "Share the full medical history", "Hand over the physical chart", "Give false information"], ans: 0, rat: "Confidentiality restricts sharing details without client consent." },
  { unit: "Unit IV", q: "A patient signs consent but says before surgery, 'I changed my mind. I don't want this.' The nurse's first action is:", opts: ["Stop pre-op prep and notify the surgeon immediately", "Tell the patient it is too late to change their mind", "Proceed to the operating room", "Ignore the statement"], ans: 0, rat: "Consent can be withdrawn at any point before a procedure." },
  { unit: "Unit IV", q: "Informed consent obtained from a parent for a minor child is legally classified as:", opts: ["Proxy / Surrogate Consent", "Direct Consent", "Implied Consent", "Informal Consent"], ans: 0, rat: "Parents provide surrogate or proxy consent for minors." },
  { unit: "Unit IV", q: "Discussing private patient details in a crowded hospital elevator constitutes:", opts: ["A breach of confidentiality", "Proper clinical handoff", "Interprofessional consultation", "Utilitarian practice"], ans: 0, rat: "Public discussions breach patient confidentiality." },
  { unit: "Unit IV", q: "Which condition invalidates a signed consent form legally?", opts: ["The client received a heavy narcotic sedative 15 minutes prior", "The client is anxious", "The client is 60 years old", "The client has mild fever"], ans: 0, rat: "Sedative medications impair decision-making capacity." },
  { unit: "Unit IV", q: "Accessing medical records of a high-profile patient out of personal curiosity is:", opts: ["An illegal and unethical privacy breach", "Acceptable if kept private", "Permitted for student learning", "Standard practice"], ans: 0, rat: "Accessing records without care duties violates privacy law." },
  { unit: "Unit IV", q: "Which legal document appoints a designated representative to make health choices if a client becomes incapacitated?", opts: ["Durable Power of Attorney for Healthcare", "Hospital Admission Form", "Nightingale Pledge", "PNC Card"], ans: 0, rat: "A healthcare power of attorney appoints a legal surrogate." },
  { unit: "Unit IV", q: "Which element of consent ensures the decision was made freely without pressure or coercion?", opts: ["Voluntariness", "Competence", "Disclosure", "Paternalism"], ans: 0, rat: "Voluntariness protects against coercion." },
  { unit: "Unit IV", q: "What is the primary value of an Ethics Case Consultation in complex clinical situations?", opts: ["It provides structured multidisciplinary review to resolve ethical impasses", "It imposes legal fines on nurses", "It replaces informed consent", "It terminates patient stays"], ans: 0, rat: "Ethics consultations offer guidance on complex ethical dilemmas." },

  // --- UNIT V: BILLS OF RIGHTS (1.5 hrs = 10 MCQs) ---
  { unit: "Unit V", q: "Rights guaranteed and enforced by statutory legislation and constitutional law are:", opts: ["Legal Rights", "Moral Rights", "Customary Rights", "Informal Rights"], ans: 0, rat: "Legal rights carry statutory backing and court enforcement." },
  { unit: "Unit V", q: "A client's basic claim to clean water, adequate food, and emergency medical care is a:", opts: ["Welfare Right", "Option Right", "Property Right", "Administrative Right"], ans: 0, rat: "Welfare rights cover basic life-sustaining resources." },
  { unit: "Unit V", q: "The right of a patient to select their physician or decline a recommended treatment is an:", opts: ["Option / Choice Right", "Welfare Right", "Executive Right", "Institutional Right"], ans: 0, rat: "Option rights safeguard personal freedom of choice." },
  { unit: "Unit V", q: "What is the nurse's primary role regarding the Patient's Bill of Rights?", opts: ["Ensuring clients are informed of their rights and advocating for their protection", "Enforcing institutional rules over rights", "Limiting client rights during stay", "Managing hospital billing"], ans: 0, rat: "Nurses protect patient rights and support informed decision-making." },
  { unit: "Unit V", q: "A competent adult demands to leave the hospital Against Medical Advice (AMA). The nurse should:", opts: ["Inform them of health risks, request signature on AMA form, and facilitate discharge", "Lock the ward exit door", "Restrain the patient physically", "Confiscate personal items"], ans: 0, rat: "Competent clients can leave AMA after risk counseling." },
  { unit: "Unit V", q: "Restraining a competent client who insists on leaving the facility may lead to charges of:", opts: ["False Imprisonment and Battery", "Negligence", "Defamation", "Beneficence"], ans: 0, rat: "Unlawful detention constitutes false imprisonment." },
  { unit: "Unit V", q: "The Patient's Bill of Rights in a tertiary care facility guarantees:", opts: ["Respectful care, privacy, full disclosure, and right to refuse treatment", "Guaranteed cure for all conditions", "Free private rooms for all", "Unlimited visitor access"], ans: 0, rat: "Bills of rights establish standard client protections and respectful care." },
  { unit: "Unit V", q: "A nurse notices family members coercing an elderly client to alter legal documents. The nurse's advocacy duty is to:", opts: ["Report suspected coercion to social services and hospital management", "Assist the family", "Ignore family business", "Request financial gain"], ans: 0, rat: "Advocacy protects vulnerable clients from coercion." },
  { unit: "Unit V", q: "To maintain objective advocacy under patient rights guidelines, a nurse must:", opts: ["Support client decisions even when personal values differ", "Impose personal beliefs on the client", "Side with management against the client", "Avoid discussing rights"], ans: 0, rat: "Objective advocacy centers on patient choice, not nurse preference." },
  { unit: "Unit V", q: "Regarding health records, standard Patient's Bill of Rights guidelines declare that clients:", opts: ["Have the right to inspect and request copies of their medical record", "Are strictly forbidden from viewing records", "Must pay excessive fines to see records", "Can view records only after discharge"], ans: 0, rat: "Clients retain the right to access their medical information." },

  // --- UNIT VI: CODE OF ETHICS (1.5 hrs = 10 MCQs) ---
  { unit: "Unit VI", q: "A Code of Ethics is best defined as:", opts: ["A formal statement of a profession's core values, ethical duties, and standards", "A list of hospital salaries", "A textbook of clinical procedures", "A criminal penal code"], ans: 0, rat: "A code of ethics articulates professional values and standards." },

  { unit: "Unit VI", q: "A key application of the Code of Ethics in clinical practice is:", opts: ["Guiding nurses to maintain competence, patient safety, and professional dignity", "Enforcing strict hospital visiting hours", "Maximizing hospital revenue", "Avoiding interprofessional communication"], ans: 0, rat: "Ethics codes direct safe, competent clinical practice." },
  { unit: "Unit VI", q: "Comparing ICN and PNC codes of ethics reveals that both codes prioritize:", opts: ["Human rights, non-discrimination, competence, and patient safety", "Hospital financial profits", "Physician absolute authority", "Strict local political alignment"], ans: 0, rat: "Both codes share global standards for human rights and safety." },
  { unit: "Unit VI", q: "A nurse observes a peer taking narcotics from the ward stock. Under the Code of Ethics, the nurse must:", opts: ["Report through official channels to protect patient safety", "Cover for the colleague", "Ignore the event", "Share the substance"], ans: 0, rat: "Codes mandate reporting impaired or illegal practices." },
  { unit: "Unit VI", q: "Maintaining personal health and fitness to provide safe care aligns with which ICN Code element?", opts: ["Nurses and Practice", "Nurses and Co-workers", "Nurses and Society", "Nurses and Politics"], ans: 0, rat: "Personal fitness for duty falls under 'Nurses and Practice'." },

  // --- UNIT VII: PROFESSIONAL AUTONOMY AND ETHICS (1.5 hrs = 10 MCQs) ---
  { unit: "Unit VII", q: "Professional autonomy in nursing is defined as:", opts: ["Independent authority to make clinical judgments within nursing scope of practice", "Practicing without adhering to clinical standards", "Working without a license", "Ignoring physician orders arbitrarily"], ans: 0, rat: "Autonomy grants clinical decision-making authority within legal scope." },
  { unit: "Unit VII", q: "Responsibility refers to performing tasks, whereas Accountability means:", opts: ["Being answerable for outcomes resulting from clinical actions and choices", "Blaming team members for mistakes", "Receiving a monthly salary", "Delegating all duties"], ans: 0, rat: "Accountability involves answerability for outcomes." },
  { unit: "Unit VII", q: "A nurse delegates vital sign checks to a nursing assistant. The assistant records inaccurate data. Who remains accountable for overall patient assessment?", opts: ["The registered nurse who delegated the task", "Only the assistant", "The hospital director", "The patient"], ans: 0, rat: "Delegating nurses retain ultimate accountability for assessment." },
  { unit: "Unit VII", q: "Minimum authoritative statements describing competent nursing care quality are:", opts: ["Standards of Nursing Practice", "Job Advertisements", "Hospital Brochures", "Personal Opinions"], ans: 0, rat: "Standards define performance expectations for competent care." },
  { unit: "Unit VII", q: "A nurse declines to perform an unfamiliar specialized procedure without prior training. This shows:", opts: ["Professional responsibility and commitment to patient safety", "Insubordination", "Unprofessional conduct", "Negligence"], ans: 0, rat: "Recognizing competence boundaries protects patients from harm." },
  { unit: "Unit VII", q: "The term 'Scope of Nursing Practice' outlines:", opts: ["Legal boundaries and activities a licensed nurse is authorized to perform", "Hospital floor layout", "Work shift durations", "Salary structure"], ans: 0, rat: "Scope of practice sets legal limits for clinical practice." },
  { unit: "Unit VII", q: "When nurses collaborate through professional organizations to advance safe care, they demonstrate:", opts: ["Professional Unity and Solidarity", "Unprofessional conduct", "Paternalism", "Negligence"], ans: 0, rat: "Unity strengthens collective advocacy for professional standards." },
  { unit: "Unit VII", q: "Which step is required prior to delegating a nursing task to a assistant?", opts: ["Assessing patient stability and confirming assistant competency", "Ensuring the doctor is absent", "Obtaining written patient consent", "Filing a contract"], ans: 0, rat: "Safe delegation requires evaluating task risk and staff competence." },
  { unit: "Unit VII", q: "A nurse reviews evidence-based clinical practice guidelines before caring for a complex wound. This reflects:", opts: ["Adherence to Professional Standards of Nursing Practice", "Trial-and-error nursing", "Subjective care", "Paternalism"], ans: 0, rat: "Applying guidelines ensures standard, quality-driven care." },
  { unit: "Unit VII", q: "A nurse identifies early post-op complications, initiates oxygen, and notifies the physician under standing orders. This shows:", opts: ["Independent Nursing Judgment and Autonomy", "Unauthorized practice", "Malpractice", "Medical diagnosis"], ans: 0, rat: "Executing protocols based on assessment reflects autonomous practice." },

  // --- UNIT VIII: ETHICAL DILEMMA IN PROFESSIONAL PRACTICE (3.0 hrs = 19 MCQs) ---
  { unit: "Unit VIII", q: "Unintentional failure to exercise standard care that a prudent nurse would provide, resulting in patient injury, is:", opts: ["Negligence", "Battery", "Assault", "Slander"], ans: 0, rat: "Negligence involves failure to meet care standards, causing injury." },
  { unit: "Unit VIII", q: "Professional negligence committed by a licensed practitioner involving failure to apply professional skill is:", opts: ["Malpractice", "Libel", "Assault", "False Imprisonment"], ans: 0, rat: "Malpractice is specialized professional negligence." },
  { unit: "Unit VIII", q: "How many legal elements must be proven simultaneously to establish a malpractice claim in court?", opts: ["4 Elements (Duty, Breach, Causation, Damages)", "2 Elements", "6 Elements", "1 Element"], ans: 0, rat: "Malpractice requires proving Duty, Breach, Causation, and Damages." },
  { unit: "Unit VIII", q: "Threatening to forcibly sedate an alert client if they continue asking questions constitutes legal:", opts: ["Assault", "Battery", "Malpractice", "Slander"], ans: 0, rat: "Assault is creating apprehension of imminent harmful contact." },
  { unit: "Unit VIII", q: "Administering a medication injection to a competent client who explicitly refused it constitutes legal:", opts: ["Battery", "Assault", "Negligence", "Defamation"], ans: 0, rat: "Battery is non-consensual physical contact or treatment." },
  { unit: "Unit VIII", q: "Writing false, defamatory statements about a colleague in an official medical chart is:", opts: ["Libel", "Slander", "Battery", "Negligence"], ans: 0, rat: "Libel is written defamation." },
  { unit: "Unit VIII", q: "Spoken false statements that damage a health professional's reputation represent:", opts: ["Slander", "Libel", "Assault", "Breach of Contract"], ans: 0, rat: "Slander is spoken defamation." },
  { unit: "Unit VIII", q: "What is the primary legal rule regarding nursing documentation during lawsuits?", opts: ["'If it was not documented, it was not done'", "Verbal reports override written charts", "Documentation is optional during emergencies", "Charts can be rewritten later"], ans: 0, rat: "Courts assume unrecorded actions were not performed." },
  { unit: "Unit VIII", q: "A fall-risk patient suffers a fracture after a nurse forgets to raise bed rails as ordered. The fracture represents:", opts: ["Damages / Injury", "Duty", "Breach", "Veracity"], ans: 0, rat: "The fracture constitutes physical damage resulting from breach." },
  { unit: "Unit VIII", q: "When managing mechanical life support equipment removal for a brain-dead patient, the nurse advocate's role is to:", opts: ["Ensure family understanding, honor advance directives, and provide compassionate support", "Decide to turn off machines independently", "Ignore family questions", "Demand financial payment"], ans: 0, rat: "Advocacy ensures patient directives are honored and families supported." },
  { unit: "Unit VIII", q: "Buying or selling human organs for financial gain is ethically and legally condemned because it:", opts: ["Exploits vulnerable individuals and violates human dignity", "Improves transplant outcomes", "Increases hospital revenue", "Eliminates donor waitlists"], ans: 0, rat: "Commercial organ trading exploits poverty and violates dignity." },
  { unit: "Unit VIII", q: "A nurse identifies an occupational hazard (e.g., defective radiation shields) in the unit. The nurse's duty is to:", opts: ["Report the risk immediately through risk management channels to protect staff and patients", "Ignore it until someone gets hurt", "Tell patients to leave", "Hide the equipment"], ans: 0, rat: "Reporting hazards mitigates risks for staff and patients." },

  { unit: "Unit VIII", q: "A valid Do Not Resuscitate (DNR) directive instructs the nursing team to:", opts: ["Withhold CPR during cardiac or respiratory arrest while continuing supportive care", "Withhold all routine food, hydration, and hygiene", "Discharge the patient immediately", "Provide full aggressive CPR"], ans: 0, rat: "DNR specifically applies to CPR while supportive care continues." },

];

let questions = [...rawQuestions];
let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerSeconds = 60 * 60; // 60 Minutes
let timerInterval = null;
let isReviewMode = false;

function initQuiz() {
  currentIndex = 0;
  userAnswers = new Array(questions.length).fill(null);
  isReviewMode = false;
  document.getElementById("results-screen").style.display = "none";
  document.getElementById("quiz-area").style.display = "block";
  startTimer();
  renderQuestion();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      alert("Time is up! Submitting your exam automatically.");
      submitQuiz();
    } else {
      timerSeconds--;
      let m = Math.floor(timerSeconds / 60);
      let s = timerSeconds % 60;
      document.getElementById("timer-display").innerText = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
  }, 1000);
}

function renderQuestion() {
  let q = questions[currentIndex];
  document.getElementById("q-unit").innerText = q.unit;
  document.getElementById("q-count").innerText = `${currentIndex + 1}/${questions.length}`;
  document.getElementById("q-text").innerText = q.q;
  document.getElementById("progress-text").innerText = `Question ${currentIndex + 1} of ${questions.length}`;

  let optionsContainer = document.getElementById("options-container");
  optionsContainer.innerHTML = "";

  const prefixes = ["A", "B", "C", "D"];
  q.opts.forEach((opt, idx) => {
    let btn = document.createElement("button");
    btn.className = "opt-btn";
    if (userAnswers[currentIndex] === idx) btn.classList.add("selected");
    
    btn.innerHTML = `<span class="opt-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
    
    if (!isReviewMode) {
      btn.onclick = () => selectOption(idx);
    } else {
      btn.disabled = true;
      if (idx === q.ans) btn.style.borderColor = "#16a34a", btn.style.background = "rgba(22, 163, 74, 0.2)";
      if (userAnswers[currentIndex] === idx && idx !== q.ans) btn.style.borderColor = "#ef4444", btn.style.background = "rgba(239, 68, 68, 0.2)";
    }
    optionsContainer.appendChild(btn);
  });

  let rationaleBox = document.getElementById("rationale-box");
  if (isReviewMode) {
    rationaleBox.style.display = "block";
    rationaleBox.innerHTML = `<strong>Rationale:</strong> ${q.rat}`;
  } else {
    rationaleBox.style.display = "none";
  }

  document.getElementById("prev-btn").style.visibility = currentIndex === 0 ? "hidden" : "visible";
  document.getElementById("next-btn").innerText = currentIndex === questions.length - 1 ? (isReviewMode ? "Finish Review" : "Submit Exam") : "Next Question →";
}

function selectOption(index) {
  userAnswers[currentIndex] = index;
  renderQuestion();
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    if (!isReviewMode) {
      if (confirm("Are you sure you want to submit your weighted 100-MCQ exam?")) {
        submitQuiz();
      }
    } else {
      document.getElementById("quiz-area").style.display = "none";
      document.getElementById("results-screen").style.display = "block";
    }
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function filterUnit(unitName) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  if (unitName === 'All') {
    questions = [...rawQuestions];
  } else {
    questions = rawQuestions.filter(q => q.unit.startsWith(unitName));
  }
  currentIndex = 0;
  userAnswers = new Array(questions.length).fill(null);
  renderQuestion();
}

function submitQuiz() {
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, idx) => {
    if (userAnswers[idx] === q.ans) score++;
  });

  let pct = Math.round((score / questions.length) * 100);
  document.getElementById("score-percent").innerText = `${pct}%`;
  document.getElementById("score-details").innerText = `You scored ${score} out of ${questions.length} questions correctly.`;

  document.getElementById("quiz-area").style.display = "none";
  document.getElementById("results-screen").style.display = "block";
}

function reviewAnswers() {
  isReviewMode = true;
  currentIndex = 0;
  document.getElementById("results-screen").style.display = "none";
  document.getElementById("quiz-area").style.display = "block";
  renderQuestion();
}

function restartQuiz() {
  timerSeconds = 60 * 60;
  questions = [...rawQuestions];
  initQuiz();
}

window.onload = initQuiz;
</script>
