<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSN Student Portal</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #202124;
      --error-bg: #ffebe9;
      --error-border: #ff8a80;
      --error-text: #c62828;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h2 {
      margin-top: 0;
      color: #111;
      font-size: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #a0c3ff;
      cursor: not-allowed;
    }

    /* Custom Error / Status Box */
    .message-box {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
    }

    .message-box.error {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .message-box a {
      color: #0d47a1;
      font-weight: bold;
      text-decoration: underline;
    }

    .loader {
      display: none;
      margin: 10px auto;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Student Portal Login</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="studentName">Full Name</label>
        <input type="text" id="studentName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="studentEmail">Email Address</label>
        <input type="email" id="studentEmail" placeholder="Enter your email" required>
      </div>

      <button type="submit" id="submitBtn">Access Portal</button>
      <div id="loader" class="loader"></div>
    </form>

    <!-- Error/Notice Display Box -->
    <div id="statusMessage" class="message-box"></div>
  </div>

  <script>
    // ⚠️ REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // Add your actual WhatsApp phone number below (Include country code, e.g., 923001234567)
    const CR_WHATSAPP_NUMBER = "923000000000"; 

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !email) return;

      // Reset state
      statusMsg.className = 'message-box';
      statusMsg.style.display = 'none';
      submitBtn.disabled = true;
      loader.style.display = 'block';

      // Setup JSONP script request (handles CORS automatically)
      const callbackName = 'handleResponse_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function (data) {
        // Clean up script tag and global callback
        delete window[callbackName];
        const scriptTag = document.getElementById(callbackName);
        if (scriptTag) scriptTag.remove();

        loader.style.display = 'none';
        submitBtn.disabled = false;

        if (data.error) {
          showErrorNotice();
          return;
        }

        // Check registration approval status
        if (data.status === 'approved') {
          // Store user details in session
          sessionStorage.setItem('student_email', data.email);
          sessionStorage.setItem('student_name', data.name);
          sessionStorage.setItem('student_access', data.access || 'all');
          
          // Redirect to dashboard page
          window.location.href = 'dashboard.html';
        } else {
          // If status is pending or not approved, show the error notice with WhatsApp link
          showErrorNotice();
        }
      };

      // Handle network failure or timeouts
      const script = document.createElement('script');
      script.id = callbackName;
      script.src = `${SCRIPT_URL}?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&callback=${callbackName}`;
      
      script.onerror = function () {
        delete window[callbackName];
        script.remove();
        loader.style.display = 'none';
        submitBtn.disabled = false;
        showErrorNotice();
      };

      document.body.appendChild(script);
    });

    function showErrorNotice() {
      const waLink = `https://wa.me/${CR_WHATSAPP_NUMBER}?text=${encodeURIComponent("Hello Mudassir, please approve my BSN portal access.")}`;
      
      statusMsg.innerHTML = `⚠️ Unable to connect right now. Please check your internet connection or contact <a href="${waLink}" target="_blank">Mudassir (CR) on WhatsApp</a> for approval.`;
      statusMsg.className = 'message-box error';
    }
  </script>

</body>
</html>
