<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin & Student Dashboard | Mudassir Hussain Khan</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #0d9488;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.08);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-dark); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }

    /* NAVBAR */
    .navbar { 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px); 
      border-bottom: 1px solid rgba(226, 232, 240, 0.8); 
      padding: 12px 16px; 
    }
    
    .nav-container { 
      max-width: 900px; 
      margin: 0 auto; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }

    .brand { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      text-decoration: none; 
      color: var(--text-dark); 
      font-weight: 800; 
      font-size: 1.1rem; 
    }

    .pulse-box {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white; 
      width: 38px; 
      height: 38px; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.15rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); 
    }

    .back-home-btn {
      background: #f1f5f9;
      color: var(--text-dark);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.2s;
    }

    .back-home-btn:hover {
      background: #e2e8f0;
    }

    /* MAIN WRAPPER */
    .main-wrapper { 
      flex: 1; 
      width: 100%; 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 20px 16px; 
    }

    /* AUTH SECTION (LOGIN / REGISTER) */
    .auth-container {
      max-width: 440px;
      margin: 40px auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s;
    }

    .input-group input:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .auth-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      transition: transform 0.2s;
      margin-top: 6px;
    }

    .auth-btn:hover {
      transform: translateY(-1px);
    }

    /* DASHBOARD PANEL */
    .dashboard-panel {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .dashboard-panel.active {
      display: flex;
    }

    .welcome-banner {
      background: linear-gradient(135deg, #0f172a, #0369a1);
      color: white;
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .welcome-banner h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .welcome-banner p {
      color: #bae6fd;
      font-size: 0.85rem;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* CODE GENERATOR FORM */
    .gen-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gen-form select, .gen-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #f8fafc;
      outline: none;
    }

    .gen-btn {
      background: #059669;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gen-btn:hover {
      background: #047857;
    }

    .generated-result {
      margin-top: 10px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #065f46;
      word-break: break-all;
      display: none;
    }

    /* STUDENT PURCHASES TABLE */
    .purchases-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .purchase-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-unlocked { background: #dcfce7; color: #15803d; }
    .badge-locked { background: #fef3c7; color: #b45309; }

    footer { 
      background: #0f172a; 
      color: #94a3b8; 
      border-top: 1px solid #1e293b; 
      padding: 24px 16px; 
      margin-top: 40px; 
      text-align: center; 
      font-size: 0.8rem; 
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="pulse-box">🔐</div>
        <span>Secure BSN Dashboard</span>
      </a>
      <a href="index.html" class="back-home-btn">← Back to Portal</a>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="main-wrapper">

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER) -->
    <div id="authContainer" class="auth-container">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">🔑 Login</button>
        <button class="auth-tab" onclick="switchTab('register')">📝 Register Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="yourname@gmail.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Access Dashboard</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Mudassir Hussain Khan" required>
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="yourname@gmail.com" required>
        </div>
        <div class="input-group">
          <label>Create Password</label>
          <input type="password" id="regPassword" placeholder="Choose a secure password" required>
        </div>
        <button type="submit" class="auth-btn">Register Account</button>
      </form>
    </div>

    <!-- DASHBOARD PANEL (LOCKED BEHIND AUTH) -->
    <div id="dashboardPanel" class="dashboard-panel">
      
      <!-- WELCOME HEADER -->
      <div class="welcome-banner">
        <div>
          <h1 id="userWelcomeTitle">Welcome, Student</h1>
          <p id="userEmailDisplay">email@example.com</p>
        </div>
        <button class="logout-btn" onclick="handleLogout()">🔒 Logout Session</button>
      </div>

      <!-- GRID CARDS -->
      <div class="grid-cards">
        
        <!-- ADMIN ACCESS CODE GENERATOR (ONLY VISIBLE FOR MUDASSIR / ADMIN EMAIL) -->
        <div class="card" id="adminGeneratorCard" style="display: none;">
          <h3>🛠️ Admin: Generate Access Code</h3>
          <div class="gen-form">
            <select id="genSubject">
              <option value="pediatric">Pediatric Health Nursing (PKR 350)</option>
              <option value="reproductive">Reproductive Health (PKR 350)</option>
              <option value="english">English (PKR 250)</option>
              <option value="perls">PERLS (PKR 250)</option>
              <option value="ALL">All Subjects Full Access</option>
            </select>
            <button type="button" class="gen-btn" onclick="generateAccessCode()">Generate Unique Code</button>
            <div id="generatedCodeBox" class="generated-result"></div>
          </div>
        </div>

        <!-- ENROLLED COURSES & PURCHASES -->
        <div class="card">
          <h3>📚 My Course Access Status</h3>
          <ul class="purchases-list" id="myPurchasesList">
            <li class="purchase-item">
              <span>Pediatric Health Nursing</span>
              <span class="status-badge badge-locked" id="status-pediatric">Locked</span>
            </li>
            <li class="purchase-item">
              <span>Reproductive Health</span>
              <span class="status-badge badge-locked" id="status-reproductive">Locked</span>
            </li>
            <li class="purchase-item">
              <span>English</span>
              <span class="status-badge badge-locked" id="status-english">Locked</span>
            </li>
            <li class="purchase-item">
              <span>PERLS</span>
              <span class="status-badge badge-locked" id="status-perls">Locked</span>
            </li>
          </ul>
        </div>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Academic Portal • Prepared by Mudassir Hussain Khan</p>
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    const ADMIN_EMAIL = "mudassirkhan002075@gmail.com"; // Admin email or change as needed

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !password) {
        alert("⚠️ Please fill in all fields.");
        return;
      }

      // Save user account in localStorage database
      const existingUser = localStorage.getItem('user_acc_' + email);
      if (existingUser) {
        alert("❌ An account with this email already exists! Please login instead.");
        switchTab('login');
        return;
      }

      const userData = { name, email, password };
      localStorage.setItem('user_acc_' + email, JSON.stringify(userData));
      
      alert("✅ Account successfully registered! You can now login from any device using your email and password.");
      switchTab('login');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value.trim();

      const storedUserRaw = localStorage.getItem('user_acc_' + email);
      
      if (!storedUserRaw) {
        alert("❌ No account found with this email. Please register first.");
        return;
      }

      const user = JSON.parse(storedUserRaw);
      if (user.password !== password) {
        alert("❌ Incorrect password. Please try again.");
        return;
      }

      // Save active session
      localStorage.setItem('active_session_email', email);
      localStorage.setItem('active_session_name', user.name);

      loadDashboard(user);
    }

    function loadDashboard(user) {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('dashboardPanel').classList.add('active');

      document.getElementById('userWelcomeTitle').innerText = "Welcome, " + user.name;
      document.getElementById('userEmailDisplay').innerText = user.email;

      // Check admin status
      if (user.email === ADMIN_EMAIL || user.email.includes('mudassir')) {
        document.getElementById('adminGeneratorCard').style.display = 'block';
      }

      // Update courses status for this specific user email
      const subjects = ['pediatric', 'reproductive', 'english', 'perls'];
      subjects.forEach(sub => {
        const isUnlocked = localStorage.getItem('unlocked_' + user.email + '_' + sub) === 'true' || 
                           localStorage.getItem('unlocked_' + sub) === 'true';
        const badge = document.getElementById('status-' + sub);
        if (isUnlocked) {
          badge.className = "status-badge badge-unlocked";
          badge.innerText = "Unlocked";
        } else {
          badge.className = "status-badge badge-locked";
          badge.innerText = "Locked";
        }
      });
    }

    function handleLogout() {
      localStorage.removeItem('active_session_email');
      localStorage.removeItem('active_session_name');
      document.getElementById('dashboardPanel').classList.remove('active');
      document.getElementById('authContainer').style.display = 'block';
      document.getElementById('loginForm').reset();
    }

    function generateAccessCode() {
      const subject = document.getElementById('genSubject').value;
      const randomCode = subject.substring(0,3).toLowerCase() + '-' + Math.floor(1000 + Math.random() * 9000);
      
      // Store code as valid
      localStorage.setItem('used_code_' + randomCode, 'false'); // false means ready to use

      const codeBox = document.getElementById('generatedCodeBox');
      codeBox.style.display = 'block';
      codeBox.innerHTML = `<strong>Generated Code:</strong> <code>${randomCode}</code><br><small>Give this code to the student who paid.</small>`;
    }

    // Auto-login check on page load
    window.addEventListener('DOMContentLoaded', () => {
      const activeEmail = localStorage.getItem('active_session_email');
      const activeName = localStorage.getItem('active_session_name');

      if (activeEmail) {
        loadDashboard({ email: activeEmail, name: activeName || 'Student' });
      }
    });
  </script>
</body>
</html>
