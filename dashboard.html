<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Dashboard | BSN Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #0d9488;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* NAVBAR */
    .navbar { 
      position: sticky; top: 0; z-index: 100; 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(14px); 
      border-bottom: 1px solid rgba(226, 232, 240, 0.8); 
      padding: 12px 16px; 
    }
    .nav-container { 
      max-width: 860px; margin: 0 auto; 
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-dark); font-weight: 800; font-size: 1.1rem; }
    .pulse-box { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
    
    .logout-btn {
      background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
      padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px;
    }

    .main-wrapper { max-width: 860px; margin: 0 auto; padding: 20px 16px; width: 100%; flex: 1; }

    /* PROFILE BANNER */
    .profile-card {
      background: linear-gradient(135deg, #0f172a 0%, #0369a1 100%);
      color: white; border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow);
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; background: #bae6fd; color: #0369a1;
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 800;
      flex-shrink: 0;
    }
    .profile-info h1 { font-size: 1.25rem; font-weight: 800; }
    .profile-info p { color: #bae6fd; font-size: 0.85rem; margin-top: 2px; }

    /* SECTION */
    .section-title { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .card h3 { font-size: 0.95rem; font-weight: 700; }
    
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    }
    .badge-locked { background: #fef3c7; color: #b45309; }
    .badge-active { background: #dcfce7; color: #15803d; }

    .action-link {
      margin-top: 14px; text-decoration: none; text-align: center; padding: 10px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700; display: block; transition: all 0.2s;
    }
    .btn-active { background: var(--primary); color: white; }
    .btn-locked { background: #f1f5f9; color: #94a3b8; pointer-events: none; }

    /* AUTH MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      background: white; border-radius: 20px; padding: 28px 22px; width: 100%; max-width: 380px; text-align: center;
    }
    .modal-card h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    .auth-input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      font-size: 0.9rem; margin-bottom: 12px; outline: none; text-transform: uppercase; font-weight: 700;
    }
    .auth-input:focus { border-color: var(--primary); }
    .auth-btn {
      width: 100%; padding: 12px; background: var(--primary-dark); color: white; border: none;
      border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .back-home { display: inline-block; margin-top: 14px; font-size: 0.8rem; color: var(--text-muted); text-decoration: none; }
  </style>
</head>
<body>

  <!-- AUTH POPUP MODAL (Shows if not logged in) -->
  <div id="authModal" class="modal-overlay" style="display: flex;">
    <div class="modal-card">
      <div class="pulse-box" style="margin: 0 auto 14px auto;">🔑</div>
      <h2>Student Login</h2>
      <p>Enter your BSN Access Key to view your personalized dashboard.</p>
      
      <input type="text" id="userKeyInput" class="auth-input" placeholder="Enter Access Key (e.g. BSN993)" onkeypress="handleEnter(event)">
      <button class="auth-btn" onclick="attemptLogin()">Login to Dashboard</button>
      
      <div>
        <a href="index.html" class="back-home">← Back to Main Portal</a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD CONTENT (Hidden until authenticated) -->
  <div id="dashboardContent" style="display: none; width: 100%;">
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand">
          <div class="pulse-box">🩺</div>
          <span>BSN Portal</span>
        </a>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
      </div>
    </header>

    <main class="main-wrapper">
      <div class="profile-card">
        <div class="avatar" id="avatarLetter">S</div>
        <div class="profile-info">
          <h1 id="welcomeUser">Welcome, Student</h1>
          <p id="accessLevel">BSN Academic Dashboard</p>
        </div>
      </div>

      <div class="section-title">Your Enrolled Courses</div>
      <div class="grid" id="courseGrid">
        <!-- Courses will be populated via JavaScript -->
      </div>
    </main>
  </div>

  <script>
    const KEYS_DATABASE = {
      'BSN993': { name: 'Full Access Student', courses: ['pediatric', 'reproductive', 'english', 'perls'] },
      'PEDS350': { name: 'Pediatric Student', courses: ['pediatric'] },
      'REPO350': { name: 'Reproductive Student', courses: ['reproductive'] },
      'ENG250': { name: 'English Student', courses: ['english'] },
      'PERLS250': { name: 'PERLS Student', courses: ['perls'] }
    };

    const COURSE_DETAILS = {
      'pediatric': { title: 'Pediatric Health Nursing', icon: '👶', bg: '#f0fdf4', link: './pediatric/index.html' },
      'reproductive': { title: 'Reproductive Health', icon: '🤰', bg: '#fdf2f8', link: './reproductive/index.html' },
      'english': { title: 'English', icon: '📚', bg: '#f5f3ff', link: './english/index.html' },
      'perls': { title: 'PERLS', icon: '💡', bg: '#f0fdfa', link: './perls/index.html' }
    };

    function attemptLogin() {
      const input = document.getElementById('userKeyInput').value.trim().toUpperCase();
      if (!input) {
        alert('Please enter your access key.');
        return;
      }

      if (KEYS_DATABASE[input]) {
        // Save session
        localStorage.setItem('bsn_user_session', input);
        KEYS_DATABASE[input].courses.forEach(c => localStorage.setItem('access_' + c, 'true'));
        renderDashboard(input);
      } else if (input.startsWith('BSN') || input.startsWith('PEDS') || input.startsWith('REPO') || input.startsWith('ENG') || input.startsWith('PERLS')) {
        // Fallback for custom keys from main portal
        localStorage.setItem('bsn_user_session', input);
        renderDashboard(input);
      } else {
        alert('❌ Invalid Access Key! Please check your code and try again.');
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') attemptLogin();
    }

    function logout() {
      localStorage.removeItem('bsn_user_session');
      location.reload();
    }

    function renderDashboard(key) {
      document.getElementById('authModal').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';

      const userInfo = KEYS_DATABASE[key] || { name: 'BSN Nursing Student', courses: [] };
      document.getElementById('welcomeUser').innerText = `Welcome, ${userInfo.name}`;
      document.getElementById('avatarLetter').innerText = userInfo.name.charAt(0);

      const grid = document.getElementById('courseGrid');
      grid.innerHTML = '';

      Object.keys(COURSE_DETAILS).forEach(courseKey => {
        const course = COURSE_DETAILS[courseKey];
        const isUnlocked = localStorage.getItem('access_' + courseKey) === 'true';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="card-icon" style="background:${course.bg}">${course.icon}</div>
              <div>
                <h3>${course.title}</h3>
                <span class="status-badge ${isUnlocked ? 'badge-active' : 'badge-locked'}">
                  ${isUnlocked ? '✅ Enrolled' : '🔒 Locked'}
                </span>
              </div>
            </div>
          </div>
          <a href="${course.link}" class="action-link ${isUnlocked ? 'btn-active' : 'btn-locked'}">
            ${isUnlocked ? 'Open Course Notes →' : 'Access Restricted'}
          </a>
        `;
        grid.appendChild(card);
      });
    }

    // Check existing login on page load
    window.addEventListener('DOMContentLoaded', () => {
      const activeSession = localStorage.getItem('bsn_user_session');
      if (activeSession) {
        renderDashboard(activeSession);
      }
    });
  </script>
</body>
</html>
