<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login / Sign In | BSN Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #0d9488;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.08);
      --shadow-lg: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow: var(--shadow-lg);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .pulse-box {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white; width: 56px; height: 56px; border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.6rem; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
      margin-bottom: 14px;
    }

    .brand-header h1 { font-size: 1.35rem; font-weight: 800; color: var(--text-dark); }
    .brand-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s; background: #f8fafc; font-weight: 500;
    }
    .form-input:focus { border-color: var(--primary); background: #ffffff; }

    .login-btn {
      width: 100%; background: var(--primary); color: white; border: none; padding: 14px;
      border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); margin-top: 8px;
    }
    .login-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    #loginError {
      font-size: 0.85rem; color: #dc2626; margin-top: 14px; text-align: center; font-weight: 700; display: none;
    }

    .demo-credentials {
      margin-top: 24px; padding: 14px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px;
      font-size: 0.8rem; color: #0369a1; line-height: 1.5; text-align: center;
    }
    .demo-credentials strong { display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="pulse-box">🩺</div>
      <h1>BSN Student Portal</h1>
      <p>Sign in to access your dashboard and courses</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="emailInput">Student Email / ID</label>
        <input type="email" id="emailInput" class="form-input" placeholder="e.g. mudassir@bsnportal.edu" required />
      </div>

      <div class="form-group">
        <label for="passwordInput">Password / Roll Number</label>
        <input type="password" id="passwordInput" class="form-input" placeholder="Enter password or roll number" required />
      </div>

      <button type="submit" class="login-btn">Secure Login →</button>
      <div id="loginError"></div>
    </form>

    <div class="demo-credentials">
      <strong>Default Student Profile (Mudassir Hussain Khan)</strong>
      Email: <code>mudassir.student@bsnportal.edu</code><br>
      Roll No / Password: <code>002075</code>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const pass = document.getElementById('passwordInput').value.trim();
      const errEl = document.getElementById('loginError');

      // Default Student Authentication Setup for Mudassir Hussain Khan
      const defaultEmail = 'mudassir.student@bsnportal.edu';
      const defaultPass = '002075';

      if ((email === defaultEmail && pass === defaultPass) || (email && pass.length >= 4)) {
        // Set active session tokens
        localStorage.setItem('bsn_current_user', email);
        localStorage.setItem('active_session_email', email);
        localStorage.setItem('active_session_name', 'Mudassir Hussain Khan');

        // Store user profile info if not already present
        const userProfileKey = 'bsn_user_' + email;
        if (!localStorage.getItem(userProfileKey)) {
          const profileData = {
            name: 'Mudassir Hussain Khan',
            email: email,
            semester: 'BSN 4th Semester',
            institute: 'New Life Institute Multan',
            rollNo: '002075'
          };
          localStorage.setItem(userProfileKey, JSON.stringify(profileData));
        }

        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        errEl.style.display = 'block';
        errEl.innerText = '❌ Invalid credentials. Please use your student email and roll number (002075).';
      }
    }

    // Auto-redirect if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const activeUser = localStorage.getItem('bsn_current_user') || localStorage.getItem('active_session_email');
      if (activeUser) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
